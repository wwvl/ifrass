# Android 多架构 APK 构建：push main / 打 tag / 手动触发。
#
# 为什么每次 push 都构建：门禁 CI（ci.yml / .cnb.yml）只跑 analyze + test，
# 不编译 Android 侧——Gradle 构建被破坏只能靠本工作流暴露；同时每次推送
# 都产出可真机安装的 APK 供测试下载。
#
# --split-per-abi 产出三个 APK（build/app/outputs/flutter-apk/）：
#   arm64-v8a（64位 ARM，主流真机）/ armeabi-v7a（32位 ARM）/ x86_64（模拟器）。
# Flutter 3.47 的 Gradle 插件对 split APK 自动按 1000 * ABI_VERSION 递增 versionCode，
# build.gradle.kts 已按此适配，无需额外配置。
#
# 签名现状：release 仍为 debug 签名（android/app/build.gradle.kts TODO），
# 产物可直接真机安装测试；正式签名后续引入 keystore secrets，不在本工作流做。

name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 同一分支的连续 push：新构建取消在途构建，不排队
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 与 ci.yml / .cnb.yml 同源：pubspec.lock 记录的 hosted url 是
    # pub.flutter-io.cn，不带此变量 --enforce-lockfile 会判定 lockfile
    # 不匹配而失败（实测 exit 65）。
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 缓存 ~/.gradle（wrapper / AGP / Kotlin / 依赖）；NDK 如需下载逐次进行
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Flutter 3.47.9
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          # 缓存 Flutter SDK 与 ~/.pub-cache，省去每次全量下载
          cache: true

      - name: deps
        run: flutter pub get --enforce-lockfile

      - name: build split-per-abi
        run: flutter build apk --release --split-per-abi

      - name: upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: apk-split-per-abi
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

      - name: github release（仅 tag 推送）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: build/app/outputs/flutter-apk/*-release.apk
