name: cna
description: "cnb.cool 第三方移动端客户端（CNB 云原生构建 / 代码托管平台）。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.13.7 <4.0.0'
  flutter: '>=3.47.9'

dependencies:
  cached_network_image: 3.4.1
  # OpenAPI 生成产物包（tool/generate.dart 产出，禁止手改，AGENTS.md §4.2）；
  # path 依赖引用的是生成物本身，生成器 openapi_flutter_gen 只存在于 tool/ 工程
  cna_api:
    path: lib/generated/cna_api
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_highlight: ^0.7.0
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: 1.0.12
  flutter_riverpod: 3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.4.0
  freezed_annotation: ^3.1.0
  go_router: ">=17.5.0 <18.0.0"
  highlight: ^0.7.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  markdown: 7.3.1
  meta: ^1.19.0
  riverpod_annotation: 4.0.7
  shared_preferences: ^2.5.6
  tdesign_flutter: ">=1.1.0 <1.2.0"
  url_launcher: ^6.3.3

dev_dependencies:
  build_runner: 2.16.2
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  integration_test:
    sdk: flutter
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  riverpod_generator: 4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
